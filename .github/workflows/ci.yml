# CI for btc-policy.
#
# Two jobs, and the split is the point:
#
#   `check`      — fmt, clippy -D warnings, and the whole test suite (including the
#                  V0-7 property/fuzz suites, which live in the workspace). Fast,
#                  and the thing every push should be able to wait for.
#
#   `launch-gate` — `attack all` (every adversarial scenario) plus ALL THREE demos
#                  (first-light, theft-refused, recovery-drill). This is the custody
#                  claim itself: "no theft path, safety track held, recovery exit
#                  reachable". It is slow, so it is a separate job — but it runs on
#                  EVERY push, because a launch gate nobody runs is a launch gate
#                  that has already rotted, and for custody code that rot is silent.
#
# Everything runs inside the repo's own Nix devShell (`flake.nix`), which is where
# the pinned toolchain and bitcoind come from. There is no second source of truth
# for the build environment, and CI must not become one.
#
# ---------------------------------------------------------------------------------
# BUILD PROFILE — the gate is the DEBUG build, deliberately (bead btc-policy-9yf).
#
# Nothing in this workspace overrides `[profile.*]`, so "debug" means Cargo's own dev
# defaults, and two of them are load-bearing for custody code: `debug-assertions` keeps
# the workspace's 17 debug assertions live (6 `debug_assert!` + 11 `debug_assert_eq!`;
# a bare `grep -c debug_assert` says 19, but two of those are prose in comments — the
# distinction matters in a block whose whole point is that a claim matches its
# mechanism), and `overflow-checks` turns a wrapping
# amount/fee arithmetic bug into a panic instead of a silently wrong number. A release
# gate compiles both out, so it would prove strictly LESS about the same commit.
#
# The objection this answers (bead btc-policy-9yf) is that the adversarial harness's pin
# calibration adapts to machine speed and build profile, so a debug CI run and a release
# local run exercise different memory costs. True, and it is the one thing the harness
# already handles rather than ignores: `calibrate_pin_cost`
# (crates/vault-cli/src/attack.rs) derives the enrolled Argon2 cost PER MACHINE so one
# evaluation lands near `PIN_COST_TARGET` whatever the profile — explicitly "because the
# same constant means entirely different things in a release build and an unoptimized
# one" — and it hard-fails at its floor and at its handler-deadline ceiling rather than
# running a control that cannot tell a correctly-configured node from a fixture. So the
# profile does not silently change what the timing assertions MEAN; it changes how much
# memory the calibration must buy for them to mean it.
#
# RESIDUAL, stated rather than closed: what would ship is a RELEASE binary, and this gate
# never executes one. That gap is real, and it is not this workflow's to close — it
# belongs to the release-candidate freeze (bead btc-policy-gbw) and the reproducible-build
# pipeline (bead btc-policy-oy3), which run against one named frozen commit. Do not read a
# green launch-gate run as evidence about a release artifact.
# ---------------------------------------------------------------------------------
name: CI

# Both triggers: `push` is what the launch gate must not miss, `pull_request` is
# what covers branches pushed from forks. A same-repo PR branch therefore builds
# twice; that duplication is cheaper than a fork PR that never ran the gate.
on:
  push:
  pull_request:
  # Manual re-run. Added 2026-07-31 (bead btc-policy-9yf): with no dispatch trigger, a
  # gate that fails for an INFRASTRUCTURE reason cannot be retried without manufacturing a
  # commit. That is part of how the failure stayed invisible.
  #
  # The bead filed this as "44/44 runs died at job startup with zero steps recorded". That
  # quantifier is wrong and is corrected here rather than left to propagate (re-measured
  # 2026-08-09 from the retained run history): of the 46 runs before the first success,
  # 24 finished in seconds — the startup-death signature — and 22 ran ~46 minutes and
  # failed, so they plainly executed. Both regimes were red and Actions was enabled
  # throughout, but "died at startup" and "ran and failed" are different defects, and only
  # the first is the one this trigger exists for. Duration is the proxy used; a 2756-second
  # run cannot have recorded zero steps.
  workflow_dispatch:

# Coalesce runs so a superseded push on a feature branch/PR does not keep a runner busy
# proving something about a commit nobody will merge. `main` is the exception on BOTH axes,
# because every permanent commit must keep its own gate record (an unrun gate rots silently):
#  - group is SHA-SPECIFIC on main, so main commits never share a group. Sharing one group
#    would let GitHub keep only ONE pending run — a third rapid push would displace the second
#    (a permanent commit) from the pending slot even with `cancel-in-progress: false`, leaving
#    it with no gate run or artifact (codex/Fable 9y5.4 review). Feature branches keep the
#    per-ref group so their superseded runs still coalesce.
#  - cancel-in-progress is false on main so an in-flight gate is never killed by a follow-up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Action-pinning policy: THIRD-PARTY actions run from a mutable branch (`@main`) are the
# supply-chain risk this custody gate must not carry, so `DeterminateSystems/*` are pinned to
# audited commit SHAs. GitHub's OWN first-party `actions/*` are kept on the stable `@v4` major
# tag — the standard GitHub maintains and moves only within v4 — rather than a commit SHA: a
# mis-copied SHA there would silently break the very gate this workflow adds, on a runner we
# cannot observe from the repo. (codex/Fable 9y5.4 review: SHA-pin the mutable-branch actions.)
jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # Report every failing check in one run rather than only the first.
      fail-fast: false
      matrix:
        check:
          - name: fmt
            run: nix develop -c cargo fmt --all --check
          - name: clippy
            run: nix develop -c cargo clippy --locked --workspace --all-targets -- -D warnings
          - name: test
            run: nix develop -c cargo test --locked --workspace
          # `cargo test` skips `#[ignore]`d tests, and every test that talks to a REAL
          # bitcoind is ignored so a bare `cargo test` outside the devShell still works.
          # That left the backend's live-Core behaviour ungated: the unit suite replays
          # canned JSON, so it proves the reconciliation logic but not what Core actually
          # does for `importdescriptors`/`listunspent` over watch-only `raw()` descriptors
          # — the vault-unspent cache's PRIMARY source since bead btc-policy-hn8, whose
          # every failure mode is a silent fallback. ~37s, so it belongs in the fast job.
          - name: regtest-backend
            run: nix develop -c cargo test --locked -p vault-node --test bitcoind_backend -- --ignored --test-threads=1
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # A pure speedup, and deliberately non-blocking: this action caches Nix store
      # paths through an UNDOCUMENTED GitHub Actions cache API, which has broken
      # before (the free tier was end-of-lifed in Feb 2025 and later restored). A
      # cache that stops working must never turn a green tree red, so its failure is
      # tolerated; every derivation it would have served still resolves from
      # cache.nixos.org.
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true
      - run: ${{ matrix.check.run }}

  launch-gate:
    name: launch gate (attack all + all three demos)
    runs-on: ubuntu-latest
    # `attack all` stands up a fresh 5-node federation per scenario and waits out
    # real Holds, hostage windows, and combine windows; first-light and theft-refused
    # add a real regtest Hold each, and recovery-drill additionally advances
    # median-time-past past a 180-day relative lock. Generous, so a slow runner reports
    # a FAILURE rather than a cancellation nobody can attribute.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        continue-on-error: true

      # Fail on stale lockfiles BEFORE anything resolves or archives them, so the
      # flake.lock/Cargo.lock copied into the artifacts below provably describe the very
      # environment that builds and tests the binaries — no silent regeneration in the
      # runner (codex 9y5.4 review). The flake check runs FIRST: `--no-update-lock-file`
      # makes nix EXIT NON-ZERO rather than resolve unlocked inputs in memory when flake.nix
      # drifted from flake.lock (verified on Nix 2.28.4 — `--no-write-lock-file` only WARNS
      # and passes, Fable 9y5.4 review), so the `nix develop` on the next line can only ever
      # run against an already-current lock.
      - name: Assert the committed lockfiles are current
        shell: bash
        run: |
          set -euo pipefail
          nix flake metadata --no-update-lock-file >/dev/null
          nix develop -c cargo metadata --locked --format-version 1 >/dev/null

      # ---------------------------------------------------------------------
      # What ran: the resolved environment, recorded before anything uses it.
      - name: Record the resolved toolchain and flake lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp flake.nix flake.lock Cargo.lock artifacts/
          # The adversarial harness's EFFECTIVE per-scenario configuration is
          # config-as-code: the `Setup` defaults + each scenario's overrides (Hold,
          # duress delay, combine slack, budgets, Core args) live here. Copy the source so
          # an auditor reads the exact knobs from the artifact WITHOUT checking out the
          # repo at $GITHUB_SHA (codex 9y5.4 review).
          cp crates/vault-cli/src/attack.rs artifacts/attack-harness-source.rs
          cp crates/vault-cli/src/demo.rs artifacts/demo-source.rs
          # recovery-drill is a gated demo but does NOT live in demo.rs, so the copy above
          # does not cover it. Without this line the artifact would silently describe two
          # of the three demos it gates (bead btc-policy-9yf).
          cp crates/vault-cli/src/recovery.rs artifacts/recovery-drill-source.rs
          {
            echo "commit:  $GITHUB_SHA"
            echo "ref:     $GITHUB_REF"
            echo "runner:  $(uname -srm)"
            nix --version
            nix develop -c rustc -Vv
            nix develop -c cargo -Vv
            # Unpiped, deliberately: `| head` would close bitcoind's stdout early
            # and, under `pipefail`, turn its SIGPIPE into a failed step.
            nix develop -c bitcoind -version
          } | tee artifacts/toolchain.txt
          nix flake metadata --no-update-lock-file --json > artifacts/flake-metadata.json

      - name: Build the launch-gate binaries
        shell: bash
        run: nix develop -c cargo build --locked -p vault-cli -p vault-node

      # The binaries the gate below actually executes. `demo`/`attack` run the
      # `btc-vault` binary, which builds and spawns `vault-node` itself, so both
      # hashes are part of "what was proven".
      - name: Record the binary hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum target/debug/btc-vault target/debug/vault-node \
            | tee artifacts/binaries.sha256

      # ---------------------------------------------------------------------
      # The gate. Each step records its exit code and its full log BEFORE failing, so
      # a FAILED gate is still attributable from the artifact rather than only from a
      # red X. Note what this does NOT do: these steps carry no `if: always()`, so the
      # first one to fail skips the ones after it, and the scorecard says so per
      # section instead of implying a clean sweep. That is deliberate — the artifact
      # covers every step that RAN, and `attack all` scorecards all 16 scenarios
      # internally, so nothing is lost by not burning ~40min of runner time proving a
      # second thing about a commit whose gate has already gone red.
      # `shell: bash` gives `-o pipefail`, without which `tee` would swallow a
      # non-zero exit and the gate would pass by accident — restated explicitly
      # because that failure mode is silent.
      - name: demo first-light
        shell: bash
        run: |
          set -o pipefail
          status=0
          nix develop -c cargo run --locked -q -p vault-cli --bin btc-vault -- demo first-light \
            2>&1 | tee artifacts/demo-first-light.log || status=$?
          echo "demo first-light:  exit $status" >> artifacts/exit-codes.txt
          exit $status

      - name: demo theft-refused
        shell: bash
        run: |
          set -o pipefail
          status=0
          nix develop -c cargo run --locked -q -p vault-cli --bin btc-vault -- demo theft-refused \
            2>&1 | tee artifacts/demo-theft-refused.log || status=$?
          echo "demo theft-refused: exit $status" >> artifacts/exit-codes.txt
          exit $status

      # The V0-10 recovery exit. Added 2026-08-08 (bead btc-policy-9yf): the CLI has had
      # three demos since recovery-drill landed, while this job gated two — and `attack
      # recovery` only OVERLAPS it, so the named demo the docs point operators at was
      # never itself run here. It sits before `attack all` for the same reason the other
      # two do: a fast, attributable failure ahead of the ~40-minute scenario sweep.
      - name: demo recovery-drill
        shell: bash
        run: |
          set -o pipefail
          status=0
          nix develop -c cargo run --locked -q -p vault-cli --bin btc-vault -- demo recovery-drill \
            2>&1 | tee artifacts/demo-recovery-drill.log || status=$?
          echo "demo recovery-drill: exit $status" >> artifacts/exit-codes.txt
          exit $status

      - name: attack all
        shell: bash
        run: |
          set -o pipefail
          status=0
          nix develop -c cargo run --locked -q -p vault-cli --bin btc-vault -- attack all \
            2>&1 | tee artifacts/attack-all.log || status=$?
          echo "attack all:        exit $status" >> artifacts/exit-codes.txt
          exit $status

      # ---------------------------------------------------------------------
      # The record. `always()`, because the artifacts of a FAILED gate are the ones
      # anybody actually needs.
      - name: Assemble the scorecard and the effective config
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts
          # Both harnesses print their scorecard LAST, so the tail from its header
          # onward is the table plus its verdict, verbatim. Slicing by header rather
          # than matching rows by indentation keeps this file from owning a print
          # format it does not control. An empty slice means the run died before it
          # got there, and each block below says so instead of going silent.
          # The `|| true` matters: GitHub runs `shell: bash` with `-e`, and a `var=$(...)`
          # whose command fails (a MISSING log when an earlier gate step failed and later ones
          # were skipped) would abort this `always()` step BEFORE writing the diagnostic
          # artifacts — the exact records a FAILED run most needs (codex 9y5.4 review).
          attack_card=$(sed -n '/ADVERSARIAL HARNESS SCORECARD/,$p' artifacts/attack-all.log 2>/dev/null || true)
          demo_card=$(sed -n '/THEFT-REFUSED SCORECARD/,$p' artifacts/demo-theft-refused.log 2>/dev/null || true)
          indent() { sed 's/^/    /'; }
          {
            echo "commit: $GITHUB_SHA"
            echo
            echo "# The federation each demo provisioned (printed by its own bring-up)"
            grep -h '^ *config:' artifacts/demo-*.log || echo "(no demo reached bring-up)"
            echo
            echo "# The adversarial harness federation"
            grep -h 'ADVERSARIAL HARNESS SCORECARD' artifacts/attack-all.log \
              || echo "(attack all did not reach its scorecard)"
            echo
            echo "# Per-scenario knobs are compile-time constants (crates/vault-cli/src/attack.rs,"
            echo "# struct Setup); the exact source is captured in artifacts/attack-harness-source.rs"
            echo "# (plus demo-source.rs and recovery-drill-source.rs) above, pinned to commit $GITHUB_SHA."
          } > artifacts/effective-config.txt
          {
            echo "# Launch gate — $GITHUB_SHA"
            echo
            echo '## Exit codes (0 = held)'
            echo
            indent 2>/dev/null < artifacts/exit-codes.txt || echo '    (no gate step ran)'
            echo
            echo '## Adversarial scenarios'
            echo
            if [ -n "$attack_card" ]; then
              printf '%s\n' "$attack_card" | indent
            else
              echo '    (attack all did not reach its scorecard)'
            fi
            echo
            echo '## Demo: theft-refused'
            echo
            if [ -n "$demo_card" ]; then
              printf '%s\n' "$demo_card" | indent
            else
              echo '    (theft-refused did not reach its scorecard)'
            fi
            echo
            echo '## Demo: first-light'
            echo
            grep -E 'ACT (ONE|TWO) OK|FIRST LIGHT COMPLETE' artifacts/demo-first-light.log \
              | indent || echo '    (first light produced no act lines)'
            echo
            echo '## Demo: recovery-drill'
            echo
            # This demo prints no scorecard block; its record IS its numbered step lines,
            # so the slice is the `[n/6]` headers plus the completion banner. A grep that
            # matches nothing is not an error here (`|| echo`) — an incomplete list is the
            # attributable evidence of WHERE it stopped, which is the point of the artifact.
            grep -E '^\[[0-9]+/6\]|RECOVERY DRILL COMPLETE' artifacts/demo-recovery-drill.log \
              | indent || echo '    (recovery drill produced no step lines)'
          } > artifacts/scorecard.md
          cat artifacts/scorecard.md

      - name: Upload the launch-gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-gate-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
