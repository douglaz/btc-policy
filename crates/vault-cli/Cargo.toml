[package]
name = "vault-cli"
description = "Coordinator + demo runner: builds PSBTs, fans out to nodes, pulls events"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "btc-vault"
path = "src/main.rs"

[dependencies]
base64 = { workspace = true }
bitcoin = { workspace = true }
# `O_NOFOLLOW`, so the coordinator credential is opened without following a final
# symlink instead of being stat-ed and then re-opened by name. Already in the tree
# (vault-node's termios FFI), so this adds a direct dep and no new crate.
libc = { workspace = true }
miniscript = { workspace = true }
# The setup ceremony's public artifacts (node bundles, escape bundle, ceremony
# input/state) are serde-derived JSON. Both crates are already in the tree via
# vault-node, so this adds no dependency to the build — only a derive to this crate.
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
# The vault descriptor template (ADR-0013 §1): the recovery-branch shape,
# timelock constants, and the builder/parser the demo + recovery drill construct
# against, so the CLI and every node agree on the frozen template by construction.
policy-core = { path = "../policy-core" }
vault-proto = { path = "../vault-proto" }
# The demo plays the SETUP CEREMONY, which must compute `manifest_hash` and each
# node's channel endorsement byte-identically to the nodes it provisions — a
# mismatch means the federation cannot boot. It therefore calls the node's own
# definitions (`channel::ceremony`) rather than keeping a second copy that no test
# on either side could prove equal.
vault-node = { path = "../vault-node" }

[lints]
workspace = true
