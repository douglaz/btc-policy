[package]
name = "vault-node"
description = "Federation signer node: one key, one policy engine, POST /sign + GET /events"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitcoin = { workspace = true }
miniscript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }
policy-core = { path = "../policy-core" }
vault-proto = { path = "../vault-proto" }

[dev-dependencies]
# `test-util` powers the paused-time retry-loop tests (deterministic backoff);
# dev-only, so it never lands in the daemon build.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
