[package]
name = "vault-proto"
description = "Shared protocol vocabulary: tx commitment, refusal codes, /sign and /events wire DTOs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
# Already a workspace dependency (built for every other crate); reused here
# only for `hashes::sha256` to compute the commitment id — no new crate lands
# in the dependency graph.
bitcoin = { workspace = true }
# The submitted PIN is a wire field but load-bearing SECRET (ADR-0008: RAM only,
# never persisted or logged). `zeroize` lets [`Pin`] scrub its buffer on drop so
# every owned copy of the plaintext — the request, its clones, the propagation
# outbox — is wiped, not just the log lines.
zeroize = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
