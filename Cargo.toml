[workspace]
resolver = "2"
members = [
    "crates/policy-core",
    "crates/vault-proto",
    "crates/vault-node",
    "crates/vault-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["base64"] }
miniscript = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The vault-node async base (V0-8a0): tokio runtime + axum HTTP. `sync` (V0-8a)
# adds the Semaphore backing the channel's pre-auth concurrency bound.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Outbound node-to-node channel client (V0-8a; user decision 2026-07-16 — V0-8b,
# V0-4, and v1 SOCKS/Tor reuse it). No TLS features: v0 channel is loopback HTTP,
# so default-tls/rustls (and their C/ring deps) stay off.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# base64 is already compiled (bitcoin's `base64` feature): a direct dep here adds
# no new transitive crate. Used for the channel envelope's opaque `payload_b64`.
base64 = "0.22"
# PIN substrate (V0-4a). Argon2id is the enrolled pin-digest KDF (ADR-0012's
# constant-cost pin-compare invariant); hand-rolling a password-hashing KDF is not
# an option, so the audited RustCrypto crate earns its place. `subtle` gives the
# branch-free constant-time selection of the pin verdict; `zeroize` scrubs the
# ephemeral pin from every owned buffer (ADR-0008 "never persisted, RAM only").
argon2 = { version = "0.5", features = ["zeroize"] }
# The node's own federation signing key is wskdf-derived at startup from an
# operator-held preimage and lives only in RAM (DESIGN.md T1, ADR-0007): there is
# no `node_seckey` at rest any more. wskdf is the user's own crate
# (github.com/douglaz/wskdf) and is reused rather than re-implemented — a
# key-derivation function is not something to hand-roll, and its `rust-argon2`
# feature keeps the build C-compiler-free (`alkali`, the libsodium path, would not).
# Pinned to a rev: a mutable git ref in a custody build is a supply-chain hole.
wskdf-core = { git = "https://github.com/douglaz/wskdf", rev = "7a840406704b1b070995eb7a301ba1f500790728", default-features = false, features = ["rust-argon2"] }
subtle = "2"
zeroize = { version = "1", features = ["serde"] }
# `Bytes::from_owner` lets reqwest carry a zeroizing channel-body owner all the
# way through the transport; the allocation is wiped when the last body clone drops.
bytes = "1"
# The node-key preimage is a signing secret typed by the operator at startup and
# `setup node-endorse`. When stdin is a terminal it must be read with echo OFF, or
# the secret lands in the display, scrollback, and any session recording. There is
# no std API for terminal echo, so this is the one place a thin `termios` FFI is
# needed; `libc` is already in the tree transitively, adds no new crate, and is the
# minimal way to do it (a purpose-built crate like `rpassword` would be heavier).
libc = "0.2"
# DEV-ONLY (V0-7). DESIGN.md T3 makes property-based mutation testing part of the
# core-proven gate, and a generator/shrinker framework is not something to
# hand-roll: shrinking a 30-output PSBT mutation down to the minimal
# counterexample is the whole value, and it ships in no binary. `default-features
# = false` drops the `fork`/`timeout` features (subprocess isolation, which these
# suites do not need) so the dev tree gains only proptest's core.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }

[workspace.lints.clippy]
unwrap_used = "warn"
