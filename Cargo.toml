[workspace]
resolver = "2"
members = [
    "crates/policy-core",
    "crates/vault-proto",
    "crates/vault-node",
    "crates/vault-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["base64"] }
miniscript = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The vault-node async base (V0-8a0): tokio runtime + axum HTTP. `sync` (V0-8a)
# adds the Semaphore backing the channel's pre-auth concurrency bound.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Outbound node-to-node channel client (V0-8a; user decision 2026-07-16 — V0-8b,
# V0-4, and v1 SOCKS/Tor reuse it). No TLS features: v0 channel is loopback HTTP,
# so default-tls/rustls (and their C/ring deps) stay off.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# base64 is already compiled (bitcoin's `base64` feature): a direct dep here adds
# no new transitive crate. Used for the channel envelope's opaque `payload_b64`.
base64 = "0.22"
# PIN substrate (V0-4a). Argon2id is the enrolled pin-digest KDF (ADR-0012's
# constant-cost pin-compare invariant); hand-rolling a password-hashing KDF is not
# an option, so the audited RustCrypto crate earns its place. `subtle` gives the
# branch-free constant-time selection of the pin verdict; `zeroize` scrubs the
# ephemeral pin from every owned buffer (ADR-0008 "never persisted, RAM only").
argon2 = { version = "0.5", features = ["zeroize"] }
subtle = "2"
zeroize = { version = "1", features = ["serde"] }
# `Bytes::from_owner` lets reqwest carry a zeroizing channel-body owner all the
# way through the transport; the allocation is wiped when the last body clone drops.
bytes = "1"

[workspace.lints.clippy]
unwrap_used = "warn"
