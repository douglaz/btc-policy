[workspace]
resolver = "2"
members = [
    "crates/policy-core",
    "crates/vault-proto",
    "crates/vault-node",
    "crates/vault-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["base64"] }
miniscript = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# The vault-node async base (V0-8a0): tokio runtime + axum HTTP. Feature set is
# deliberately narrow — the next milestones (V0-8a channel, V0-8b/V0-4 timers)
# add reqwest/etc., not this task.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[workspace.lints.clippy]
unwrap_used = "warn"
