[workspace]
resolver = "2"
members = [
    "crates/policy-core",
    "crates/vault-proto",
    "crates/vault-node",
    "crates/vault-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["base64"] }
miniscript = "12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[workspace.lints.clippy]
unwrap_used = "warn"
